<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Chat | 100% Live Connected</title>
    <!-- Supabase JS Kitabxanası -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f1a 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- GİRİŞ PANELİ --- */
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .login-container h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-container p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .input-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        /* --- CHAT PANELİ --- */
        .chat-container {
            display: none;
            width: 95%;
            max-width: 900px;
            height: 85vh;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .chat-header {
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .dot {
            width: 10px;
            height: 10px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
        }

        .brand h2 {
            font-size: 1.3rem;
            color: #00f2fe;
            letter-spacing: 1px;
        }

        .user-info {
            font-size: 0.9rem;
            color: #ccc;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Mesaj qutuları dizaynı */
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.4;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.outgoing {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.3);
        }

        .meta-data {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .message.outgoing .meta-data {
            color: rgba(255, 255, 255, 0.8);
        }

        .msg-text {
            word-break: break-word;
            font-size: 0.95rem;
        }

        /* Input sahəsi */
        .chat-input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            background: #00f2fe;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #4facfe;
        }

        .send-btn svg {
            width: 22px;
            height: 22px;
            fill: #10101e;
            transform: translateX(2px);
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        @media (max-width: 768px) {
            .chat-container { width: 100%; height: 100vh; border-radius: 0; border: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ PANELİ -->
    <div class="login-container" id="loginPanel">
        <h1>IP Chat</h1>
        <p>Supabase Realtime Çata Qoşul</p>
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Məs: Zirniyet" autocomplete="off">
        </div>
        <button class="login-btn" onclick="joinChat()">Daxil Ol</button>
    </div>

    <!-- CHAT PANELİ -->
    <div class="chat-container" id="chatPanel">
        <div class="chat-header">
            <div class="brand">
                <div class="dot"></div>
                <h2>IP CHAT // LIVE</h2>
            </div>
            <div class="user-info" id="userTag">Yüklənir...</div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- SƏNİN SUPABASE KREDENSİALLARIN ---
        const SUPABASE_URL = "https://ocggjlrdsjxswhskzokq.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_fCUM6CR3mBwKDyuubO_lKw_7o0nWXai";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUsername = "";
        let userIP = "0.0.0.0";

        window.onload = async () => {
            // İstifadəçinin IP-sini götürürük
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (e) {
                userIP = "192.168." + Math.floor(Math.random() * 254) + "." + Math.floor(Math.random() * 254);
            }

            // Enter düyməsi ilə işləmə
            document.getElementById('usernameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') joinChat(); });
            document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        };

        // Çata giriş funksiyası
        async function joinChat() {
            const input = document.getElementById('usernameInput');
            currentUsername = input.value.trim();

            if (currentUsername === "") {
                alert("Zəhmət olmasa adınızı yazın qaqa!");
                return;
            }

            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('chatPanel').style.display = 'flex';
            document.getElementById('userTag').innerText = `${currentUsername} (${userIP})`;

            // 1. Verilənlər bazasındakı köhnə mesajları çəkirik
            await fetchOldMessages();

            // 2. REALTIME DINLƏMƏ (Tam mərkəzi sinxronizasiya)
            _supabase
                .channel('room-messages')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'messages' },
                    (payload) => {
                        const newMsg = payload.new;
                        
                        // Kimin göndərdiyinə baxıb dizayn veririk (Mən -> outgoing, Başqası -> incoming)
                        let type = (newMsg.ip === userIP && newMsg.sender === currentUsername) ? 'outgoing' : 'incoming';
                        
                        // Tarixi oxunaqlı formata salırıq
                        let msgTime = new Date(newMsg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        
                        // Ekrana əlavə edirik
                        appendMessage({ ...newMsg, time: msgTime }, type);
                    }
                )
                .subscribe();
        }

        // Mesajı Supabase-ə ötürən funksiya
        async function sendMessage() {
            const msgInput = document.getElementById('messageInput');
            const text = msgInput.value.trim();

            if (text === "") return;

            const messageData = {
                sender: currentUsername,
                ip: userIP,
                text: text
            };

            msgInput.value = "";
            msgInput.focus();

            // Databazaya yazırıq, uğurlu olsa Realtime hər kəsin ekranına anında ötürəcək
            const { error } = await _supabase
                .from('messages')
                .insert([messageData]);

            if (error) console.error('Giriş xətası:', error);
        }

        // Keçmiş yazışmaları yükləmək
        async function fetchOldMessages() {
            const { data, error } = await _supabase
                .from('messages')
                .select('*')
                .order('id', { ascending: true });

            if (error) return;

            if (data) {
                data.forEach(msg => {
                    let type = (msg.ip === userIP && msg.sender === currentUsername) ? 'outgoing' : 'incoming';
                    let msgTime = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    appendMessage({ ...msg, time: msgTime }, type);
                });
            }
        }

        // Ekrana yeni sətir əlavə edən əsas vizual funksiya
        function appendMessage(data, type) {
            const chatMessagesContainer = document.getElementById('chatMessages');
            
            // Dublikat (təkrar) mesaj yaranmasının qarşısını almaq üçün ID yoxlanışı
            if (data.id && document.getElementById(`msg-${data.id}`)) return;

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', type);
            if(data.id) messageDiv.id = `msg-${data.id}`;

            messageDiv.innerHTML = `
                <div class="meta-data">
                    <span>${data.sender} [${data.ip}]</span>
                    <span>${data.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <div class="msg-text">${escapeHTML(data.text)}</div>
            `;

            chatMessagesContainer.appendChild(messageDiv);
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight; // Həmişə ən aşağıya sürüşdürür
        }

        // Təhlükəsizlik funksiyası (XSS qorunması)
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
